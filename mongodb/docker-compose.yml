x-mongo-common: &mongo-common
  image: mongo:latest
  networks:
    - mongo-cluster
  security_opt:
    - apparmor=unconfined

services:
  config1:
    <<: *mongo-common
    container_name: config1
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27017", "--dbpath", "/data/db"]
    ports:
      - "27019:27017"
    volumes:
      - ../data/config1:/data/db

  config2:
    <<: *mongo-common
    container_name: config2
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27017", "--dbpath", "/data/db"]
    ports:
      - "27020:27017"
    volumes:
      - ../data/config2:/data/db

  config3:
    <<: *mongo-common
    container_name: config3
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27017", "--dbpath", "/data/db"]
    ports:
      - "27021:27017"
    volumes:
      - ../data/config3:/data/db

  shard1_replica1:
    <<: *mongo-common
    container_name: shard1_replica1
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27017", "--dbpath", "/data/db"]
    ports:
      - "27031:27017"
    volumes:
      - ../data/shard1_replica1:/data/db

  shard1_replica2:
    <<: *mongo-common
    container_name: shard1_replica2
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27017", "--dbpath", "/data/db"]
    ports:
      - "27032:27017"
    volumes:
      - ../data/shard1_replica2:/data/db

  shard2_replica1:
    <<: *mongo-common
    container_name: shard2_replica1
    command: ["mongod", "--shardsvr", "--replSet", "shard2ReplSet", "--port", "27017", "--dbpath", "/data/db"]
    ports:
      - "27033:27017"
    volumes:
      - ../data/shard2_replica1:/data/db

  shard2_replica2:
    <<: *mongo-common
    container_name: shard2_replica2
    command: ["mongod", "--shardsvr", "--replSet", "shard2ReplSet", "--port", "27017", "--dbpath", "/data/db"]
    ports:
      - "27034:27017"
    volumes:
      - ../data/shard2_replica2:/data/db

  shard3_replica1:
    <<: *mongo-common
    container_name: shard3_replica1
    command: ["mongod", "--shardsvr", "--replSet", "shard3ReplSet", "--port", "27017", "--dbpath", "/data/db"]
    ports:
      - "27035:27017"
    volumes:
      - ../data/shard3_replica1:/data/db

  shard3_replica2:
    <<: *mongo-common
    container_name: shard3_replica2
    command: ["mongod", "--shardsvr", "--replSet", "shard3ReplSet", "--port", "27017", "--dbpath", "/data/db"]
    ports:
      - "27036:27017"
    volumes:
      - ../data/shard3_replica2:/data/db

  mongos:
    <<: *mongo-common
    container_name: mongos_router
    command: mongos --configdb configReplSet/${HOSTIP}:27019,${HOSTIP}:27020,${HOSTIP}:27021 --bind_ip 0.0.0.0 --port 27017
    environment:
      - HOSTIP=${HOSTIP}
    ports:
      - "27041:27017"

networks:
  mongo-cluster:
    driver: bridge
